<html>
<head>
  <link rel="stylesheet" href="../assets/css/search_result_css.css">
</head>
<body>

  <h1>Search Results Page</h1>

  <div>
    <input type="text" id="serviceInput" placeholder="Search for a service (e.g. plumber)">
    <input type="text" id="localityInput" placeholder="Enter your locality">
    <button id="searchBtn">Search</button>
    <label><input type="checkbox"id="proximityToggle">Search by Proximity</label>
  </div>

  <div id="resultsContainer"></div>

<template id="workerCardTemplate">
  <div class="worker-card">
    <img class="worker-photo" src="" alt="worker photo">
    <div class="name-and-kyc">
      <h3 class="worker-name"></h3>
      <span class="worker-verified-badge"></span>
    </div>
    <p class="worker-trade"></p>
    <p class="worker-locality"></p> 
    <p class="worker-rating">
      <span class="star-icon">★</span>
      <span class="rating-value"></span>
      <span class="rating-count"></span>
    </p>
    <p class="worker-price">Price: <span class="price-value"></span></p>
    <button class="book-now-btn">Book Now</button>
  </div>
</template>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/search_result_js.js"></script>
</body>
</html>
